/**:
  ros__parameters:
    joint_names: ['shoulder_yaw', 'shoulder_roll', 'shoulder_pitch', 'upperarm_roll', 'elbow', 'forearm_roll', 'wrist_pitch']
    move_home_topic: True
    shoulder_yaw:
      joint_type: "soft_joint"
      min_joint_angle: -1.5708
      max_joint_angle: 0.7
      right:
        motor_id: 1
      left:
        motor_id: 2
    shoulder_roll:
      joint_type: "soft_joint"
      min_joint_angle: -1.4
      max_joint_angle: 1.4
      right:
        motor_id: 3
      left:
        motor_id: 4
    shoulder_pitch:
      joint_type: "soft_joint"
      min_joint_angle: 0.0
      max_joint_angle: 1.0
      right:
        motor_id: 5
      left:
        motor_id: 6
    upperarm_roll:
      joint_type: "soft_joint"
      min_joint_angle: -1.0
      max_joint_angle: 3.0
      right:
        motor_id: 7
      left:
        motor_id: 8
    elbow:
      joint_type: "soft_joint"
      min_joint_angle: -0.1
      max_joint_angle: 2.1
      right:
        motor_id: 10
      left:
        motor_id: 9
    forearm_roll:
      joint_type: "motor_joint"
      min_joint_angle: -1.5708
      max_joint_angle: 1.5708
      motor_id: 11
    wrist_pitch:
      joint_type: "soft_joint"
      min_joint_angle: -1.5
      max_joint_angle: 1.5
      right:
        motor_id: 13
      left:
        motor_id: 12
    

/gh360/shoulder/motor_handler:
  ros__parameters: 
    joint_names: ['shoulder_yaw', 'shoulder_roll', 'shoulder_pitch'] 
    port_name: "/dev/serial/by-id/usb-FieldworkRobotics_GH2_Shoulder-RS485_D35ZDA8R-if00-port0"
    baud_rate: 1000000
    protocol: 2
    shoulder_yaw:
      motor_init_pos: 0.0
      right:
        movement_direction: 1
        offset: 0.0
      left:
        movement_direction: 1
        offset: 0.0
    shoulder_roll:
      motor_init_pos: 0.0
      right:
        movement_direction: 1
        offset: 0.0
      left:
        movement_direction: 1
        offset: 0.0
    shoulder_pitch:
      motor_init_pos: 3.1416
      right:
        movement_direction: 1
        offset: -3.1416
      left:
        movement_direction: -1
        offset: -9.4248

/gh360/upperarm/motor_handler:
  ros__parameters:
    joint_names: ['upperarm_roll', 'elbow']
    port_name: "/dev/serial/by-id/usb-FieldworksRobotics_GH2_Upper-RS485_D35ZFRUI-if00-port0"
    baud_rate: 1000000
    protocol: 2
    upperarm_roll:
      motor_init_pos: 0.0
      right:
        movement_direction: -1
        offset: 3.1416
      left:
        movement_direction: -1
        offset: -3.1416
    elbow:
      motor_init_pos: 3.1416
      right:
        movement_direction: -1
        offset: -10.2102
      left:
        movement_direction: 1
        offset: -2.97700
      

/gh360/lowerarm/motor_handler:
  ros__parameters:
    joint_names: ['forearm_roll', 'wrist_pitch']
    port_name: "/dev/serial/by-id/usb-FieldworkRobotics_GH2_Lower-RS485_D35NR2H3-if00-port0"
    baud_rate: 1000000
    protocol: 2
    wrist_pitch:
      motor_init_pos: 0.0
      right:
        movement_direction: -1
        offset: 0.0
      left:
        movement_direction: 1
        offset: 0.0
    forearm_roll:
      motor_init_pos: 0.0
      movement_direction: -1
      offset: -3.1416

/gh360/encoder_handler:
  ros__parameters:
    port_names: ['/gh360/shoulder/encoders', '/gh360/upperarm/encoders', '/gh360/lowerarm/encoders']
    shoulder_yaw:
      port_name: "/gh360/shoulder/encoders"
      port_id: 2
      offset: 1.3
      inverter: -1
    shoulder_roll:
      port_name: "/gh360/shoulder/encoders"
      port_id: 1
      offset: 0.05
      inverter: -1
    shoulder_pitch:
      port_name: "/gh360/upperarm/encoders"
      port_id: 1
      offset: 0.1076
      inverter: -1
    upperarm_roll:
      port_name: "/gh360/upperarm/encoders"
      port_id: 2
      offset: 1.1
      inverter: 1
    elbow:
      port_name: "/gh360/upperarm/encoders"
      port_id: 3
      offset: -0.5
      inverter: 1
    wrist_pitch:
      port_name: "/gh360/lowerarm/encoders"
      port_id: 3
      offset: 4.04
      inverter: 1

/gh360_control/joint_velocity:
  ros__parameters:
    max_motor_velocity: 10.0
    control_mode: "open_loop"
    shoulder_yaw:
      radius_active_pulley: 0.018
      radius_passive_pulley: 0.0745
    shoulder_roll:
      radius_active_pulley: 0.018
      radius_passive_pulley: 0.0505
    shoulder_pitch:
      radius_active_pulley: 0.018
      radius_passive_pulley: 0.05
    upperarm_roll:
      radius_active_pulley: 0.0156
      radius_passive_pulley: 0.043
    elbow:
      radius_active_pulley: 0.0156
      radius_passive_pulley: 0.04
    wrist_pitch:
      radius_active_pulley: 0.0156
      radius_passive_pulley: 0.03